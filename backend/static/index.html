<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deduction Recovery</title>
  <style>
:root {
  --bg: #0f1419; --bg-elevated: #1a2332; --bg-card: #1e2a3a; --border: #2d3a4f;
  --text: #e7ecf3; --text-muted: #8b9bb4; --primary: #3b82f6; --primary-hover: #2563eb;
  --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #06b6d4;
  --radius: 8px;
  font-family: system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; }
button { cursor: pointer; border: none; border-radius: var(--radius); padding: 0.5rem 1rem; background: var(--primary); color: #fff; font-weight: 500; font-size: 0.875rem; }
button:hover:not(:disabled) { background: var(--primary-hover); }
button:disabled { opacity: 0.5; }
button.secondary { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text); }
button.ghost { background: transparent; color: var(--text-muted); }
button.danger { background: var(--danger); }
button.success { background: var(--success); }
input, select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 0.5rem 0.75rem; font-size: 0.875rem; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
.header { background: var(--bg-elevated); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.header h1 { font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
.logo { width: 28px; height: 28px; background: linear-gradient(135deg, var(--primary), var(--info)); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; }
.main { display: flex; min-height: calc(100vh - 56px); }
.sidebar { width: 200px; background: var(--bg-elevated); border-right: 1px solid var(--border); padding: 1rem 0; }
.sidebar button { display: block; width: 100%; text-align: left; background: transparent; color: var(--text-muted); border-radius: 0; padding: 0.65rem 1.25rem; }
.sidebar button.active, .sidebar button:hover { background: rgba(59,130,246,0.12); color: var(--primary); }
.content { flex: 1; padding: 1.5rem; overflow-x: auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem; }
.stat .lbl { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.3rem; }
.stat .val { font-size: 1.4rem; font-weight: 700; }
.stat .sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.2rem; }
.stat.hl { border-color: var(--primary); }
.filters { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; align-items: flex-end; }
.filters .f { display: flex; flex-direction: column; gap: 0.2rem; min-width: 130px; }
.filters label { font-size: 0.68rem; text-transform: uppercase; color: var(--text-muted); }
.table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { text-align: left; padding: 0.7rem 1rem; background: var(--bg-elevated); color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); }
tr:hover td { background: rgba(255,255,255,0.02); }
tr.click { cursor: pointer; }
.badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; }
.badge.open { background: rgba(59,130,246,0.2); color: #60a5fa; }
.badge.disputed { background: rgba(245,158,11,0.2); color: #fbbf24; }
.badge.resolved { background: rgba(16,185,129,0.2); color: #34d399; }
.badge.closed { background: rgba(139,155,180,0.2); color: #94a3b8; }
.badge.draft,.badge.not_disputed { background: rgba(139,155,180,0.2); color: #94a3b8; }
.badge.submitted { background: rgba(6,182,212,0.2); color: #22d3ee; }
.badge.in_review { background: rgba(168,85,247,0.2); color: #c084fc; }
.badge.won { background: rgba(16,185,129,0.25); color: #34d399; }
.badge.partial { background: rgba(245,158,11,0.25); color: #fbbf24; }
.badge.lost { background: rgba(239,68,68,0.2); color: #f87171; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
.modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto; }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 1.4rem; border-bottom: 1px solid var(--border); }
.modal-b { padding: 1.4rem; }
.modal-f { padding: 1rem 1.4rem; border-top: 1px solid var(--border); display: flex; gap: 0.6rem; justify-content: flex-end; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-bottom: 1rem; }
.di label { display: block; font-size: 0.68rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.15rem; }
.di .v { font-weight: 500; }
.sec { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin: 1.1rem 0 0.6rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
.bar-list { display: flex; flex-direction: column; gap: 0.5rem; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 70px; gap: 0.6rem; align-items: center; font-size: 0.82rem; }
.bar-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
.track { height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; background: var(--primary); border-radius: 4px; }
.bar-row .a { text-align: right; font-variant-numeric: tabular-nums; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
@media (max-width: 700px) { .sidebar { display: none; } .grid2, .two-col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="logo">DR</span> Deduction Recovery</h1>
    <select id="companySelect" style="min-width:180px"></select>
  </div>
  <div class="main">
    <aside class="sidebar">
      <button id="navDash" class="active" onclick="setView('dashboard')">Dashboard</button>
      <button id="navDed" onclick="setView('deductions')">Deductions</button>
    </aside>
    <main class="content" id="content"></main>
  </div>
  <div id="modalRoot"></div>
<script>
const API = '';
let view = 'dashboard', companyId = '', companies = [], reasons = [], dashboard = null, deductions = [], selected = null;
let filters = { status: '', reason_code: '', search: '', only_disputable: false };

const fmt = (n, c='USD') => n==null ? '—' : new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:0}).format(n);
const fmtD = d => { try { return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); } catch { return d; } };
const badge = s => s ? `<span class="badge ${s}">${s.replace('_',' ')}</span>` : '';

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || r.statusText); }
  return r.json();
}

async function init() {
  companies = await api('/api/companies');
  reasons = await api('/api/reasons');
  const sel = document.getElementById('companySelect');
  sel.innerHTML = '<option value="">All Companies</option>' + companies.filter(c=>c.is_active).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  sel.onchange = () => { companyId = sel.value; refresh(); };
  refresh();
}

function setView(v) {
  view = v;
  document.getElementById('navDash').classList.toggle('active', v==='dashboard');
  document.getElementById('navDed').classList.toggle('active', v==='deductions');
  refresh();
}

async function refresh() {
  const q = companyId ? `?company_id=${companyId}` : '';
  if (view === 'dashboard') {
    dashboard = await api('/api/dashboard' + q);
    renderDashboard();
  } else {
    const p = new URLSearchParams();
    if (companyId) p.set('company_id', companyId);
    if (filters.status) p.set('status', filters.status);
    if (filters.reason_code) p.set('reason_code', filters.reason_code);
    if (filters.search) p.set('search', filters.search);
    if (filters.only_disputable) p.set('only_disputable', 'true');
    deductions = await api('/api/deductions?' + p);
    renderDeductions();
  }
}

function renderDashboard() {
  const s = dashboard.summary;
  const maxA = Math.max(...dashboard.by_reason.map(r=>r.amount), ...dashboard.by_retailer.map(r=>r.amount), 1);
  document.getElementById('content').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="lbl">Total Deductions</div><div class="val">${s.total_deductions}</div><div class="sub">${fmt(s.total_amount)}</div></div>
      <div class="stat"><div class="lbl">Open</div><div class="val" style="color:#60a5fa">${s.open_count}</div><div class="sub">${fmt(s.open_amount)}</div></div>
      <div class="stat"><div class="lbl">In Dispute</div><div class="val" style="color:#fbbf24">${s.disputed_count}</div><div class="sub">${fmt(s.disputed_amount)} disputed</div></div>
      <div class="stat hl"><div class="lbl">Potential Recovery</div><div class="val" style="color:#34d399">${fmt(s.potential_recovery)}</div><div class="sub">Outstanding disputable</div></div>
      <div class="stat"><div class="lbl">Recovered</div><div class="val" style="color:#34d399">${fmt(s.recovered_total)}</div><div class="sub">${s.recovery_rate!=null?s.recovery_rate+'% of disputed':'—'}</div></div>
    </div>
    <div class="two-col">
      <div class="table-wrap" style="padding:1.2rem">
        <h3 style="margin-bottom:0.9rem;font-size:0.95rem">By Reason</h3>
        <div class="bar-list">${dashboard.by_reason.map(r=>`
          <div class="bar-row"><span class="n" title="${r.label}">${r.label}</span>
          <div class="track"><div class="fill" style="width:${(r.amount/maxA)*100}%"></div></div>
          <span class="a">${fmt(r.amount)}</span></div>`).join('')}</div>
      </div>
      <div class="table-wrap" style="padding:1.2rem">
        <h3 style="margin-bottom:0.9rem;font-size:0.95rem">By Retailer</h3>
        <div class="bar-list">${dashboard.by_retailer.slice(0,8).map(r=>`
          <div class="bar-row"><span class="n">${r.name}</span>
          <div class="track"><div class="fill" style="width:${(r.amount/maxA)*100}%;background:var(--info)"></div></div>
          <span class="a">${fmt(r.amount)}</span></div>`).join('')}</div>
      </div>
    </div>
    ${!companyId ? `<div class="table-wrap" style="padding:1.2rem;margin-top:1.25rem">
      <h3 style="margin-bottom:0.9rem;font-size:0.95rem">By Company</h3>
      <div class="bar-list">${dashboard.by_company.map(c=>`
        <div class="bar-row"><span class="n">${c.name}</span>
        <div class="track"><div class="fill" style="width:${(c.amount/maxA)*100}%;background:var(--warning)"></div></div>
        <span class="a">${fmt(c.amount)}</span></div>`).join('')}</div>
    </div>` : ''}
  `;
}

function renderDeductions() {
  document.getElementById('content').innerHTML = `
    <div class="filters">
      <div class="f"><label>Status</label>
        <select id="fStatus"><option value="">All</option><option value="open">Open</option><option value="disputed">Disputed</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select>
      </div>
      <div class="f"><label>Reason</label>
        <select id="fReason"><option value="">All</option>${reasons.map(r=>`<option value="${r.code}">${r.label}</option>`).join('')}</select>
      </div>
      <div class="f" style="min-width:180px"><label>Search</label><input id="fSearch" placeholder="Invoice, ID..." /></div>
      <div class="f" style="flex-direction:row;align-items:center;gap:0.4rem;padding-top:1rem">
        <input type="checkbox" id="fDisp" style="width:auto" /><label for="fDisp" style="text-transform:none;font-size:0.85rem">Only typically disputable</label>
      </div>
    </div>
    <div class="table-wrap">
      ${deductions.length===0 ? '<div style="padding:3rem;text-align:center;color:var(--text-muted)">No deductions match.</div>' : `
      <table><thead><tr>
        <th>ID</th><th>Company</th><th>Retailer</th><th>Date</th><th>Amount</th><th>Reason</th><th>Status</th><th>Dispute</th><th>Recovered</th>
      </tr></thead><tbody>
      ${deductions.map(d=>`<tr class="click" onclick="openDetail('${d.id}')">
        <td style="font-family:monospace;font-size:0.78rem">${d.id}</td>
        <td>${d.company.name}</td><td>${d.retailer.name}</td><td>${fmtD(d.deduction_date)}</td>
        <td style="font-variant-numeric:tabular-nums">${fmt(d.amount,d.currency)}</td>
        <td>${d.reason.label}${d.reason.typically_disputable?' <span style="color:var(--success)">●</span>':''}</td>
        <td>${badge(d.status)}</td><td>${badge(d.dispute_status)}</td>
        <td>${d.recovered_amount!=null?fmt(d.recovered_amount,d.currency):'—'}</td>
      </tr>`).join('')}
      </tbody></table>`}
    </div>`;
  document.getElementById('fStatus').value = filters.status;
  document.getElementById('fReason').value = filters.reason_code;
  document.getElementById('fSearch').value = filters.search;
  document.getElementById('fDisp').checked = filters.only_disputable;
  document.getElementById('fStatus').onchange = e => { filters.status = e.target.value; refresh(); };
  document.getElementById('fReason').onchange = e => { filters.reason_code = e.target.value; refresh(); };
  document.getElementById('fSearch').onkeydown = e => { if (e.key==='Enter') { filters.search = e.target.value; refresh(); } };
  document.getElementById('fDisp').onchange = e => { filters.only_disputable = e.target.checked; refresh(); };
}

async function openDetail(id) {
  selected = await api('/api/deductions/' + id);
  renderModal();
}

function renderModal() {
  const d = selected;
  document.getElementById('modalRoot').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-h"><h2 style="font-size:1.1rem">${d.id} · ${d.invoice_number}</h2>
        <button class="ghost" onclick="closeModal()">✕</button></div>
      <div class="modal-b">
        <div class="grid2">
          <div class="di"><label>Company</label><div class="v">${d.company.name}</div></div>
          <div class="di"><label>Retailer</label><div class="v">${d.retailer.name} (${d.retailer.type})</div></div>
          <div class="di"><label>Amount</label><div class="v">${fmt(d.amount,d.currency)}</div></div>
          <div class="di"><label>Date</label><div class="v">${fmtD(d.deduction_date)}</div></div>
          <div class="di"><label>Reason</label><div class="v">${d.reason.label}
            ${d.reason.typically_disputable?'<span style="color:var(--success);margin-left:6px">(typically disputable)</span>':'<span style="color:var(--text-muted);margin-left:6px">(rarely worth disputing)</span>'}</div></div>
          <div class="di"><label>Status</label><div class="v">${badge(d.status)} ${badge(d.dispute_status)}</div></div>
        </div>
        <div class="di" style="margin-bottom:1rem"><label>Description</label><div class="v">${d.description}</div></div>
        ${(d.disputed_amount!=null||d.recovered_amount!=null)?`<div class="grid2">
          <div class="di"><label>Disputed Amount</label><div class="v">${fmt(d.disputed_amount,d.currency)}</div></div>
          <div class="di"><label>Recovered</label><div class="v" style="color:var(--success)">${fmt(d.recovered_amount,d.currency)}${d.recovery_rate!=null?` (${d.recovery_rate}%)`:''}</div></div>
        </div>`:''}
        <div class="sec">Notes & Recovery</div>
        <textarea id="mNotes" rows="3" style="width:100%;margin-bottom:0.7rem">${d.notes||''}</textarea>
        ${(d.status==='disputed'||['partial','won'].includes(d.dispute_status))?`
        <div style="margin-bottom:0.7rem"><label style="font-size:0.68rem;color:var(--text-muted)">Recovered Amount</label>
        <input id="mRec" type="number" step="0.01" value="${d.recovered_amount??''}" style="max-width:150px" /></div>`:''}
      </div>
      <div class="modal-f">
        <button class="secondary" onclick="saveNotes()">Save Notes</button>
        ${d.status==='open'?`
          <button class="secondary" onclick="act({dispute_status:'not_disputed'})">Accept (Not Dispute)</button>
          <button onclick="act({dispute_status:'draft'})" ${!d.reason.typically_disputable?'disabled':''}>Start Dispute</button>`:''}
        ${d.dispute_status==='draft'?`<button onclick="act({dispute_status:'submitted'})">Mark Submitted</button>`:''}
        ${d.dispute_status==='submitted'?`<button onclick="act({dispute_status:'in_review'})">Mark In Review</button>`:''}
        ${['submitted','in_review'].includes(d.dispute_status)?`
          <button class="success" onclick="act({dispute_status:'won'})">Won (Full)</button>
          <button style="background:var(--warning)" onclick="act({dispute_status:'partial'})">Partial Recovery</button>
          <button class="danger" onclick="act({dispute_status:'lost',recovered_amount:0})">Lost</button>`:''}
      </div>
    </div>
  </div>`;
}

function closeModal() { document.getElementById('modalRoot').innerHTML = ''; selected = null; }

async function act(body) {
  const notes = document.getElementById('mNotes')?.value;
  if (notes != null) body.notes = notes;
  const recEl = document.getElementById('mRec');
  if (recEl && recEl.value !== '' && body.dispute_status !== 'lost') {
    const v = parseFloat(recEl.value);
    if (!isNaN(v)) body.recovered_amount = v;
  }
  try {
    selected = await api('/api/deductions/' + selected.id, {
      method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    renderModal();
    refresh();
  } catch (e) { alert(e.message); }
}

async function saveNotes() {
  const body = { notes: document.getElementById('mNotes').value };
  const recEl = document.getElementById('mRec');
  if (recEl && recEl.value !== '') { const v = parseFloat(recEl.value); if (!isNaN(v)) body.recovered_amount = v; }
  try {
    selected = await api('/api/deductions/' + selected.id, {
      method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    renderModal();
    refresh();
  } catch (e) { alert(e.message); }
}

init();
</script>
</body>
</html>
